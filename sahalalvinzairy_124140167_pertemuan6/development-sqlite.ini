[app:main]
use = egg:pyramid-mahasiswa

pyramid.reload_templates = true
sqlalchemy.url = sqlite:///%(here)s/pyramid_mahasiswa.sqlite

[alembic]
script_location = %(here)s/pyramid_mahasiswa/alembic
sqlalchemy.url = sqlite:///%(here)s/pyramid_mahasiswa.sqlite

[server:main]
use = egg:waitress#main
listen = localhost:6543

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = DEBUG
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
