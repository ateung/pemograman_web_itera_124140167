[app:main]
use = egg:pyramid-mahasiswa

pyramid.reload_templates = false
sqlalchemy.url = postgresql://pyramid_user:pyramid_pass@localhost:5432/pyramid_mahasiswa

[server:main]
use = egg:waitress#main
listen = 0.0.0.0:6543

[loggers]
keys = root, pyramid_mahasiswa, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = INFO
handlers =
qualname = pyramid_mahasiswa

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
